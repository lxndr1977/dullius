order: 6
tag: "A partir de 4 anos"
title: "Teatro"
summary: "Trabalhado de forma integrada ao corpo e à expressão cênica, dialogando diretamente com a dança"
description: "​As aulas de Teatro da Dullius são um espaço de desenvolvimento artístico e expressivo. Ao longo do ano, os alunos exploram exercícios de improviso, criação de personagens, construção de cenas e interpretação de textos."
imageSrc: "/images/teatro/capa-teatro.webp"

intro:
  eyebrow: "Teatro"
  title: "Corpo e expressão cênica dialogando diretamente com a dança"
  content:
    - type: paragraph
      text: |
        O teatro é trabalhado de forma integrada ao corpo e à expressão cênica, dialogando diretamente com a dança. As atividades estimulam a criatividade, a escuta, a imaginação e a autonomia, além de desenvolverem a consciência corporal, coordenação, ritmo e ocupação do espaço.
    - type: heading
      text: "O Teatro Integrado à Dança"
    - type: paragraph
      text: |
        O teatro é trabalhado de forma integrada ao corpo e à expressão cênica, dialogando diretamente com a dança. As atividades estimulam a criatividade, a escuta, a imaginação e a autonomia, além de desenvolverem a consciência corporal, coordenação, ritmo e ocupação do espaço.
    - type: heading
      text: "Benefícios para além do palco"
    - type: paragraph
      text: |
        A prática do teatro também contribui para habilidades fundamentais no dia a dia, tais como:
    - type: list
      items:
        - label: "Foco e concentração"
          text: "Melhora na atenção e memorização."
        - label: "Trabalho em equipe e empatia"
          text: "Respeito ao espaço do outro e colaboração."
        - label: "Autoconfiança"
          text: "Mais segurança e desenvoltura para se comunicar."
    - type: heading
      text: "Espetáculo de final de ano"
    - type: paragraph
      text: |
        No segundo semestre, inicia-se a preparação da apresentação que fará parte do espetáculo de final de ano da escola, permitindo que os alunos vivenciem todo o processo criativo até o grande dia no palco!

